name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project from zip
        run: |
          mkdir -p proj
          unzip -q ThemeKeeper.zip -d proj
          sed -i 's/^dependencyResolution {/dependencyResolutionManagement {/' proj/ThemeKeeper/settings.gradle.kts
          find proj -type f | sort

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: proj/ThemeKeeper
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ThemeKeeper-debug
          path: proj/ThemeKeeper/app/build/outputs/apk/debug/*.apk
