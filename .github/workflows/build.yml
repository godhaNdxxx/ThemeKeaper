name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract and patch project
        run: |
          mkdir -p proj
          unzip -q ThemeKeeper.zip -d proj
          cd proj/ThemeKeeper
          patch -p1 < ../../patches/all.patch
          patch -p1 < ../../patches/battery.patch
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Reuse signing key between builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: themekeeper-debug-keystore-v1

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: proj/ThemeKeeper
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Show errors
        if: failure()
        working-directory: proj/ThemeKeeper
        run: |
          grep -E "^e: |What went wrong|ERROR:" -A2 build.log | head -60 > err.txt || true
          while IFS= read -r line; do echo "::error::$line"; done < err.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ThemeKeeper-debug
          path: proj/ThemeKeeper/app/build/outputs/apk/debug/*.apk
